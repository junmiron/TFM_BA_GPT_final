# OpenAI profile used by the tool-heavy agents (no parallel tool calls).
provider: autogen_ext.models.openai.OpenAIChatCompletionClient
config:
  # api_key is injected from OPENAI_API_KEY (environment or .env)
  model: gpt-4o
  parallel_tool_calls: false
  model_info:
    vision: false
    function_calling: true
    json_output: true
    family: gpt-4o
    structured_output: false
    multiple_system_messages: true
