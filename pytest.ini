[pytest]
# Third-party deprecation warnings, filtered by their exact category so real
# warnings in our own code still surface.
# - traceloop-sdk (pulled in by literalai -> chainlit) uses class-based Pydantic
#   config, which Pydantic 2 deprecates.
# - fastmcp's JWT auth provider imports the deprecated authlib.jose module.
filterwarnings =
    ignore::pydantic.PydanticDeprecatedSince20
    ignore::authlib.deprecate.AuthlibDeprecationWarning
