<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>Pipeline animado — Chat de tópicos + subtítulos</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;margin:0;padding:24px;background:#fafafa;color:#111}
    .wrap{max-width:1200px;margin:0 auto}
    .controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:16px 0}
    button{padding:10px 14px;border:1px solid #bbb;border-radius:10px;background:#fff;cursor:pointer}
    button:disabled{opacity:.5;cursor:not-allowed}
    .status{font-variant-numeric:tabular-nums;margin-left:auto}
    .stage{border:1px solid #e0e0e0;background:#fff;border-radius:12px;padding:12px;overflow:auto;max-height:70vh}
    .caption{margin-top:12px;padding:12px;border-radius:10px;background:#fff;border:1px solid #e5e7eb;line-height:1.35}
    .caption b{font-weight:700}
    /* Texto grande + líneas más gruesas */
    .mermaid svg { font-size: 26px; }
    .mermaid .node rect, .mermaid .node polygon, .mermaid .node path { stroke-width: 3px; }
    .mermaid .edgePaths path { stroke-width: 3.5px; }
    /* Animación de trazo en aristas nuevas */
    .edge-draw { stroke-linecap: round; transition: stroke-dashoffset 700ms ease-out; }
    .edge-draw.animating { filter: drop-shadow(0 0 1px rgba(0,0,0,0.25)); }
    /* Fade suave al re-render */
    .graph-enter{animation:fadeIn .2s ease-out}
    @keyframes fadeIn{from{opacity:.98}to{opacity:1}}
  </style>
</head>
<body>
<div class="wrap">
  <h1>Pipeline animado (progresivo con subtítulos)</h1>

  <div class="controls">
    <button id="back">⬅️ Atrás</button>
    <button id="next">➡️ Siguiente</button>
    <button id="reset">🔄 Reiniciar</button>
    <span class="status"><span id="step">0</span>/<span id="total">0</span> pasos</span>
  </div>

  <div class="stage">
    <div id="target" class="graph-enter"></div>
  </div>
  <div class="caption" id="caption"><b>Paso 0:</b> Inicio — sólo se muestra el nodo de entrada.</div>
</div>

<script>
  // Mermaid init
  mermaid.initialize({
    startOnLoad: false,
    securityLevel: 'loose',
    theme: 'default',
    flowchart: { htmlLabels: true, curve: 'basis', nodeSpacing: 110, rankSpacing: 120 },
    themeVariables: { fontSize: '26px' }
  });

  // ====== Estilos de clase ======
  const styleHeader = `
flowchart TB;

classDef agent    fill:#E3F2FD,stroke:#64B5F6,stroke-width:3px;
classDef tool     fill:#E8F5E9,stroke:#66BB6A,stroke-width:3px;
classDef file     fill:#FFF8E1,stroke:#FFB74D,stroke-width:3px;
classDef decision fill:#FCE4EC,stroke:#F06292,stroke-width:3px;
classDef store    fill:#F3E5F5,stroke:#BA68C8,stroke-width:3px;
classDef terminal fill:#ECEFF1,stroke:#90A4AE,stroke-width:3px;
`;

  // ====== Nodos ======
  const nodes = {
    Astart: 'Astart([**▶️ Inicio**]):::terminal;',
    A1: 'A1[**📐 planning_agent**]:::agent;',
    A2: 'A2[**🔀 SelectorGroupChat**]:::agent;',
    TOPICS: 'TOPICS[**💬 chat_compartido_de_tópicos**]:::tool;',

    A3: 'A3[**🎤 interviewer_agent**]:::agent;',
    A4: 'A4[**🙋 user_proxy**]:::agent;',
    A5: 'A5[**📝 summarizer_agent**]:::agent;',
    A6: 'A6[**📄 functional_spec_writer_agent**]:::agent;',
    A7: 'A7[**🔎 functional_spec_checker_agent**]:::agent;',
    A8: 'A8[**🎨 diagram_creator_agent**]:::agent;',
    A9: 'A9[**👀 mermaid_code_reviewer_agent**]:::agent;',
    A10: 'A10[**🛑 terminate_agent**]:::agent;',
    Aend: 'Aend([**🏁 TERMINATE**]):::terminal;',

    T1: 'T1[**💾 save_conversation_to_jsonl**]:::tool;',
    T2: 'T2[**📂 read_md_file_tool**]:::tool;',
    T3: 'T3[**✍️ write_md_file_tool**]:::tool;',
    T4: 'T4[**🖼️ write_mermaid_to_file_tool**]:::tool;',

    AT1: 'AT1[**📚 use_case_agent**]:::tool;',
    AT2: 'AT2[**📖 glossary_agent**]:::tool;',

    C1: 'C1[**📝 canvas.update_file_tool**]:::tool;',

    E1: 'E1[**📦 move_file**]:::tool;',
    E2: 'E2[**🧹 clean_mermaid**]:::tool;',
    E3: 'E3[**🖼️ render_mermaid_png**]:::tool;',
    E4: 'E4[**📑 format_and_export_pdf**]:::tool;',
    E5: 'E5[**🧠 save_experience_to_chromadb**]:::tool;',

    M1: 'M1[(**🗂️ RAG_ChromaDB**)]:::store;',
    M2: 'M2[(**🧬 Episodic_ChromaDB**)]:::store;',
    M3: 'M3[(**🖼️ Canvas_Memory_canvas_diagram.md**)]:::store;',

    F1: 'F1[**📝 conversation/interview.jsonl**]:::file;',
    F2: 'F2[**📄 conversation/functional_specification.md**]:::file;',
    F3: 'F3[**📐 conversation/process_diagram.mmd**]:::file;',
    F4: 'F4[**📂 experience/&lt;SESSION_ID&gt;/**]:::file;',
    FX1: 'FX1[**📝 interview.jsonl**]:::file;',
    FX2: 'FX2[**🖼️ process_diagram.png**]:::file;',
    FX3: 'FX3[**📄 functional_specification.md**]:::file;',
    FX4: 'FX4[**📑 functional_specification.pdf**]:::file;',

    DAPP: 'DAPP{**✅ APPROVE SUMMARY?**}:::decision;',
    DCHK: 'DCHK{**🔍 FSD completo 1..9?**}:::decision;',
    DREV: 'DREV{**🖼️ Diagrama aprobado?**}:::decision;'
  };

  // ====== Pasos (con chat de tópicos + subtítulos mejorados) ======
  const steps = [
    { edge: 'Astart --> A1', nodes: ['Astart','A1'], caption: 'Inicio → El Planificador arranca la orquestación del equipo.' },
    { edge: 'A1 <-->|**lee/publica**| TOPICS', nodes: ['A1','TOPICS'], caption: 'El Planificador publica y consulta el **chat compartido de tópicos** (estado semántico global).' },
    { edge: 'TOPICS -->|**tópico activo → selección**| A2', nodes: ['TOPICS','A2'], caption: 'El Selector lee el tópico activo del chat y elige al siguiente agente.' },

    // Selector fan-out
    { edge: 'A2 --> A3', nodes: ['A2','A3'], caption: 'El Selector activa al **Entrevistador** para iniciar la captura de requisitos.' },
    { edge: 'A2 --> A5', nodes: ['A2','A5'], caption: 'El Selector prepara al **Resumidor** para consolidar información.' },
    { edge: 'A2 --> A6', nodes: ['A2','A6'], caption: 'El Selector prepara al **Escritor** del FSD (Functional Specification Document).' },
    { edge: 'A2 --> A7', nodes: ['A2','A7'], caption: 'El Selector prepara al **Verificador** del FSD.' },
    { edge: 'A2 --> A8', nodes: ['A2','A8'], caption: 'El Selector prepara al **Creador de diagramas**.' },
    { edge: 'A2 --> A9', nodes: ['A2','A9'], caption: 'El Selector prepara al **Revisor de Mermaid**.' },
    { edge: 'A2 --> A10', nodes: ['A2','A10'], caption: 'El Selector prepara al **Terminador** (cierre y empaquetado de artefactos).' },

    // Entrevista
    { edge: 'A3 --> A4', nodes: ['A3','A4'], caption: 'El Entrevistador dialoga con el **Usuario** para detallar necesidades.' },
    { edge: 'A3 --> M1', nodes: ['A3','M1'], caption: 'Durante la entrevista, el Entrevistador realiza consultas al **RAG** (ChromaDB).' },
    { edge: 'A3 --> T1', nodes: ['A3','T1'], caption: 'Se usa la tool **save_conversation_to_jsonl** para registrar Q&A de forma atómica.' },
    { edge: 'T1 --> F1', nodes: ['T1','F1'], caption: 'Se actualiza **conversation/interview.jsonl** (log de entrevista).' },

    // Resumen + decisión
    { edge: 'A5 --> M1', nodes: ['A5','M1'], caption: 'El Resumidor consulta el **RAG** para sintetizar con contexto.' },
    { edge: 'A5 --> DAPP', nodes: ['A5','DAPP'], caption: 'Se solicita aprobación del resumen al usuario (**APPROVE SUMMARY?**).' },
    { edge: 'DAPP -- **Si** --> A6', nodes: ['DAPP','A6'], caption: 'Resumen aprobado → se redacta el FSD (Functional Specification Document).' },
    { edge: 'DAPP -. **No** .-> A3', nodes: ['DAPP','A3'], caption: 'No aprobado → regresar a entrevista para ampliar o corregir.' },

    // Escritura
    { edge: 'A6 --> M1', nodes: ['A6','M1'], caption: 'El Escritor usa **RAG** para enriquecer secciones del FSD.' },
    { edge: 'A6 --> AT1', nodes: ['A6','AT1'], caption: 'El Escritor invoca la **Agent Tool**: use_case_agent.' },
    { edge: 'AT1 --> M1', nodes: ['AT1','M1'], caption: 'use_case_agent consulta el **RAG** para construir casos de uso.' },
    { edge: 'AT1 --> A6', nodes: ['AT1','A6'], caption: 'Se devuelven **casos de uso** para incorporarlos al FSD.' },
    { edge: 'A6 --> AT2', nodes: ['A6','AT2'], caption: 'El Escritor invoca la **Agent Tool**: glossary_agent.' },
    { edge: 'AT2 --> M1', nodes: ['AT2','M1'], caption: 'glossary_agent consulta el **RAG** para consolidar términos.' },
    { edge: 'AT2 --> A6', nodes: ['AT2','A6'], caption: 'Se devuelve el **glosario** para el FSD.' },
    { edge: 'A6 --> T3', nodes: ['A6','T3'], caption: 'Se usa la tool **write_md_file_tool** para guardar el FSD (Markdown).' },
    { edge: 'T3 --> F2', nodes: ['T3','F2'], caption: 'Archivo actualizado: **functional_specification.md**.' },

    // Verificación
    { edge: 'A7 --> T2', nodes: ['A7','T2'], caption: 'El Verificador usa **read_md_file_tool** para leer el FSD.' },
    { edge: 'T2 --> F2', nodes: ['T2','F2'], caption: 'Lectura de **functional_specification.md** finalizada.' },
    { edge: 'A7 --> M1', nodes: ['A7','M1'], caption: 'El Verificador usa **RAG** para asegurar cobertura de todos los temas.' },
    { edge: 'A7 --> DCHK', nodes: ['A7','DCHK'], caption: 'Decisión de **completitud** del FSD.' },
    { edge: 'DCHK -- **Si** --> A8', nodes: ['DCHK','A8'], caption: 'Completo → crear diagrama.' },
    { edge: 'DCHK -. **NEEDS_INFO user** .-> A3', nodes: ['DCHK','A3'], caption: 'Falta info del usuario → volver al Entrevistador.' },
    { edge: 'DCHK -. **NEEDS_INFO UC/Glosario** .-> A6', nodes: ['DCHK','A6'], caption: 'Faltan UC/Glosario → volver al Escritor.' },

    // Creación de diagrama en Canvas
    { edge: 'A8 --> T2', nodes: ['A8','T2'], caption: 'El Creador de diagramas **lee el FSD** con read_md_file_tool.' },
    { edge: 'A8 --> C1', nodes: ['A8','C1'], caption: 'El Creador de diagramas **actualiza Canvas** con canvas.update_file_tool.' },
    { edge: 'C1 --> M3', nodes: ['C1','M3'], caption: '**Canvas Memory** se actualiza y queda disponible para los agentes.' },

    // Revisión del diagrama
    { edge: 'A9 --> C1', nodes: ['A9','C1'], caption: 'El Revisor trabaja sobre **Canvas Memory** (iteración del diagrama).' },
    { edge: 'A9 --> DREV', nodes: ['A9','DREV'], caption: 'Decisión de aprobación del diagrama.' },
    { edge: 'DREV -- **Si** --> T4', nodes: ['DREV','T4'], caption: 'Aprobado → usar **write_mermaid_to_file_tool** para escribir .mmd (Mermaid).' },
    { edge: 'DREV -. **No** .-> A8', nodes: ['DREV','A8'], caption: 'No aprobado → iterar sobre el diagrama.' },
    { edge: 'T4 --> F3', nodes: ['T4','F3'], caption: 'Archivo generado: **process_diagram.mmd**.' },

    // Terminación del pipeline
    { edge: 'F1 --> A10', nodes: ['F1','A10'], caption: 'El Terminador **recoge el log de conversación**.' },
    { edge: 'F2 --> A10', nodes: ['F2','A10'], caption: 'El Terminador recoge el **FSD**.' },
    { edge: 'F3 --> A10', nodes: ['F3','A10'], caption: 'El Terminador recoge el **diagrama .mmd**.' },
    { edge: 'A10 --> E1', nodes: ['A10','E1'], caption: 'El Terminador usa la tool **move_file** para mover artefactos a experiencia.' },
    { edge: 'E1 --> F4', nodes: ['E1','F4'], caption: 'Se crea/actualiza la estructura final en **experience/&lt;SESSION_ID&gt;/**.' },
    { edge: 'A10 --> E2', nodes: ['A10','E2'], caption: 'El Terminador usa **clean_mermaid** para verificación y limpieza del código.' },
    { edge: 'E2 --> F4', nodes: ['E2','F4'], caption: 'Se guarda el **.mmd limpio** en el directorio de renderización.' },
    { edge: 'A10 --> E3', nodes: ['A10','E3'], caption: 'El Terminador usa **render_mermaid_png** para generar imágenes.' },
    { edge: 'E3 --> F4', nodes: ['E3','F4'], caption: 'Imagen **process_diagram.png** guardada.' },
    { edge: 'A10 --> E4', nodes: ['A10','E4'], caption: 'El Terminador usa **format_and_export_pdf** para producir el PDF.' },
    { edge: 'E4 --> F4', nodes: ['E4','F4'], caption: 'Archivo **functional_specification.pdf** guardado.' },
    { edge: 'A10 --> E5', nodes: ['A10','E5'], caption: 'El Terminador usa **save_experience_to_chromadb** para memoria episódica.' },
    { edge: 'E5 --> M2', nodes: ['E5','M2'], caption: 'La **Episodic_ChromaDB** es actualizada.' },
    { edge: 'A10 --> Aend', nodes: ['A10','Aend'], caption: 'Pipeline finalizado.' },

    // Contenido del directorio experience/<SESSION_ID>/
    { edge: 'F4 --> FX1', nodes: ['F4','FX1'], caption: 'Listado: **interview.jsonl** (Q&A pareados).' },
    { edge: 'F4 --> FX2', nodes: ['F4','FX2'], caption: 'Listado: **process_diagram.png**.' },
    { edge: 'F4 --> FX3', nodes: ['F4','FX3'], caption: 'Listado: **functional_specification.md**.' },
    { edge: 'F4 --> FX4', nodes: ['F4','FX4'], caption: 'Listado: **functional_specification.pdf**.' }
  ];

  // ====== Render progresivo + animación de aristas nuevas ======
  const target = document.getElementById('target');
  const stepEl = document.getElementById('step');
  const totalEl = document.getElementById('total');
  const captionEl = document.getElementById('caption');
  totalEl.textContent = steps.length;

  let step = 0;
  let prevEdgeCount = 0;

  function updateCaption(stepCount){
    if(stepCount === 0){
      captionEl.innerHTML = '<b>Paso 0:</b> Inicio.';
      return;
    }
    const s = steps[stepCount-1];
    captionEl.innerHTML = `<b>Paso ${stepCount}:</b> ${s.caption || ('Añade: ' + s.edge)}`;
  }

  async function render(stepCount) {
    // Nodos necesarios (siempre incluir Astart)
    const needed = new Set(['Astart']);
    const edgesToDraw = [];
    for (let i = 0; i < stepCount; i++) {
      const s = steps[i];
      s.nodes.forEach(id => needed.add(id));
      edgesToDraw.push(s.edge);
    }
    const nodeSrc = Array.from(needed).map(id => nodes[id]).join('\n');
    const edgeSrc = edgesToDraw.map(e => e + ';').join('\n');
    const src = styleHeader + '\n' + nodeSrc + '\n' + edgeSrc + '\n';

    const { svg } = await mermaid.render('graph-' + Date.now(), src);
    target.innerHTML = svg;
    stepEl.textContent = stepCount;
    updateCaption(stepCount);

    // Animar solo las aristas recién añadidas
    const svgEl = target.querySelector('svg');
    const paths = Array.from(svgEl.querySelectorAll('.edgePaths path'));
    const newEdges = stepCount - prevEdgeCount;
    if (newEdges > 0) {
      const toAnimate = paths.slice(-newEdges);
      toAnimate.forEach(p => {
        try {
          const len = p.getTotalLength();
          p.classList.add('edge-draw','animating');
          p.style.strokeDasharray = String(len);
          p.style.strokeDashoffset = String(len);
          requestAnimationFrame(() => {
            p.style.strokeDashoffset = '0';
            setTimeout(() => p.classList.remove('animating'), 800);
          });
        } catch(e) {}
      });
    }
    prevEdgeCount = stepCount;

    target.classList.remove('graph-enter'); void target.offsetWidth; target.classList.add('graph-enter');
  }

  // Controles
  function next(){ if (step < steps.length) { step++; render(step); } }
  function back(){ if (step > 0) { step--; render(step); } }
  function reset(){ step = 0; prevEdgeCount = 0; render(step); }

  document.getElementById('next').addEventListener('click', next);
  document.getElementById('back').addEventListener('click', back);
  document.getElementById('reset').addEventListener('click', reset);

  // Render inicial
  render(step);
</script>
</body>
</html>
